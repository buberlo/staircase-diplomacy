<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Staircase — Local Co-op Phaser Platformer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --text: #e5e7eb;
        --accent: #7dd3fc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #101a33 0%, var(--bg) 45%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      #game canvas {
        display: block;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(125, 211, 252, 0.18),
          0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        z-index: 10;
      }

      .loading span {
        padding: 0.75rem 1.1rem;
        border: 1px solid rgba(125, 211, 252, 0.3);
        border-radius: 999px;
        background: rgba(17, 24, 39, 0.72);
        color: var(--accent);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.85rem;
      }

      @media (max-width: 640px) {
        #game canvas {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div class="loading" aria-hidden="true">
        <span>Preparing staircase…</span>
      </div>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: #0b1020;
          color: #e5e7eb;
        "
      >
        Enable JavaScript to climb the split staircase.
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
